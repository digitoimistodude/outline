name: Build dude image

# Builds the Dude fork image (Outline + our patches on the `dude` branch) and
# pushes it to GHCR. The dude-docs box pulls this image instead of building
# locally, so the production box never carries the build load. Ref: DEV-703.

on:
  push:
    branches: [dude]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/digitoimistodude/outline
  BASE_IMAGE: ghcr.io/digitoimistodude/outline-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: ${{ env.BASE_IMAGE }}:dude
          cache-from: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BASE_IMAGE }}:buildcache,mode=max

      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:dude
          tags: |
            ${{ env.IMAGE }}:dude
            ${{ env.IMAGE }}:dude-${{ steps.vars.outputs.sha }}
